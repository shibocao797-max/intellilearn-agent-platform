# 项目相关配置
ruoyi:
  # 名称
  name: 智学协同教育智能体平台
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  config:
    import:
      - optional:file:./config/local-secrets.yml
      - optional:file:../config/local-secrets.yml
      - optional:file:../../config/local-secrets.yml
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小（增大以支持视频上传）
      max-file-size: 200MB
      # 设置总上传的文件大小
      max-request-size: 500MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${TOKEN_SECRET:dev-only-change-me}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# ========== 文件存储配置 ==========
file-storage:
  # 存储类型: local（本地磁盘，默认）/ minio（MinIO对象存储）
  type: minio
  # MinIO 配置（仅 type=minio 时生效）
  minio:
    # MinIO 服务地址（API端口，非Console端口）
    endpoint: ${MINIO_ENDPOINT:http://localhost:19000}
    # 访问密钥
    access-key: ${MINIO_ACCESS_KEY:minio}
    # 秘密密钥
    secret-key: ${MINIO_SECRET_KEY:minio123456}
    # 存储桶名称（启动时自动创建）
    bucket: ${MINIO_BUCKET:edu-agent}

# ========== LangChain4j 配置（多智能体系统 LLM 调用层） ==========
langchain4j:
  open-ai:
    # 主模型 — 复杂生成（文档、代码、画像抽取）
    chat-model:
      base-url: ${AGNES_TEXT_BASE_URL:https://apihub.agnes-ai.com/v1}
      api-key: ${AGNES_TEXT_API_KEY:}
      model-name: ${AGNES_TEXT_MODEL_NAME:agnes-2.0-flash}
      max-tokens: 16384
      temperature: 0.7
      timeout: 600s
      log-requests: true
      log-responses: false
    # 流式模型 — SSE 流式输出（辅导答疑）
    streaming-chat-model:
      base-url: ${AGNES_TEXT_STREAM_BASE_URL:${AGNES_TEXT_BASE_URL:https://apihub.agnes-ai.com/v1}}
      api-key: ${AGNES_TEXT_STREAM_API_KEY:${AGNES_TEXT_API_KEY:}}
      model-name: ${AGNES_TEXT_STREAM_MODEL_NAME:${AGNES_TEXT_MODEL_NAME:agnes-2.0-flash}}
      max-tokens: 8192
      temperature: 0.7
      timeout: 300s

# ========== Agnes 多模态媒体生成配置 ==========
media:
  agnes:
    image:
      base-url: ${AGNES_IMAGE_BASE_URL:https://apihub.agnes-ai.com}
      api-key: ${AGNES_IMAGE_API_KEY:}
      model-name: ${AGNES_IMAGE_MODEL_NAME:agnes-image-2.1-flash}
      endpoint: /v1/images/generations
    video:
      base-url: ${AGNES_VIDEO_BASE_URL:https://apihub.agnes-ai.com}
      api-key: ${AGNES_VIDEO_API_KEY:}
      model-name: ${AGNES_VIDEO_MODEL_NAME:agnes-video-v2.0}
      create-endpoint: /v1/videos
      query-endpoint: /agnesapi
      create-inline-poll: false       # 创建视频任务后不阻塞主流程，状态查询接口负责轮询
      poll-attempts: ${AGNES_VIDEO_POLL_ATTEMPTS:6}
      poll-interval-ms: ${AGNES_VIDEO_POLL_INTERVAL_MS:5000}

# ========== LangGraph4j 配置（多智能体编排层） ==========
langgraph4j:
  checkpoint:
    type: mysql
    mysql:
      datasource: default   # 复用 RuoYi 已有的 Druid 数据源
  studio:
    enabled: false           # 生产环境关闭，开发调试时可设为 true
    port: 9090

# ========== edu-agent 业务配置 ==========
edu:
  ai:
    profile:
      update-interval-messages: 5   # 每N轮对话触发一次画像更新
      context-window-messages: 10   # 画像抽取使用的历史轮数
    resource:
      quality-threshold: 0.7        # 质量阈值（低于此分触发重新生成）
      max-retries: 3                # 最大重试次数
    review:
      timeout-seconds: 12           # 质量审核单资源/多资源统一短超时，超时走规则兜底
      parallelism: 3                # 质量审核并发数
    rag:
      vector-enabled: true           # 本地 embedding 向量检索，失败自动降级关键词召回
      vector-candidate-limit: 80     # 向量索引候选知识片段数量，控制首次检索耗时
      vector-min-score: 0.18         # 低相似度片段过滤阈值
    parallelism:
      resource-generation: 4        # 资源生成并行度
