# Copy this file to config/local-secrets.yml and replace every placeholder.
# Never commit the copied file or real API keys.

token:
  secret: replace-with-a-random-secret-at-least-32-characters

edu:
  mysql:
    password: replace-with-a-strong-mysql-password

spring:
  datasource:
    druid:
      statViewServlet:
        login-password: replace-with-a-strong-druid-password

file-storage:
  type: local
  minio:
    access-key: replace-with-minio-access-key
    secret-key: replace-with-a-strong-minio-secret

langchain4j:
  open-ai:
    chat-model:
      api-key: replace-with-provider-api-key
    streaming-chat-model:
      api-key: replace-with-provider-api-key

media:
  agnes:
    image:
      api-key: replace-with-image-api-key
    video:
      api-key: replace-with-video-api-key
